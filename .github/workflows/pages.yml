# Publica diseno/ en GitHub Pages en cada push a main.
name: Publicar sitio
on:
  push:
    branches: [main]
    paths: ["diseno/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: diseno
      - id: deploy
        uses: actions/deploy-pages@v4
