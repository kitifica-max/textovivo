<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de envíos — TextoVivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilos.css">
<style></style>
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera">
  <div class="envoltura">
    <a class="marca" href="index.html" aria-label="TextoVivo, inicio">Texto<b>Vivo</b></a>
    <nav class="navegacion" aria-label="Principal">
      <a href="biblioteca.html">Biblioteca</a>
      <a class="ocultable" href="index.html#guia">Cómo funciona</a>
      <a class="ocultable" href="autores.html">Para autores</a>
      <a class="boton chico" href="entrar.html">Entrar</a>
    </nav>
  </div>
</header>
<main id="contenido" style="padding:clamp(40px,6vw,80px) 0 clamp(64px,9vw,120px)">
  <div class="envoltura">
    <p class="micro">Administración</p>
    <h1 style="margin:14px 0 18px">Revisión de envíos.</h1>
    <div class="tarjeta" id="acceso" style="max-width:520px">
      <label for="secreto" style="display:block;margin-bottom:6px;font-weight:600">Clave de administración</label>
      <input id="secreto" type="password" autocomplete="off" style="width:100%;font:inherit;padding:13px 16px;border-radius:14px;border:1px solid var(--linea)">
      <button class="boton" id="entrar" type="button" style="margin-top:14px">Ver envíos</button>
      <p class="nota" id="msg" role="status" style="margin-top:12px"></p>
    </div>
    <div id="lista" style="display:grid;gap:14px;margin-top:28px"></div>
  </div>
</main>
<footer class="pie-sitio">
  <div class="envoltura">
    <div>
      <div class="firma"><b>TextoVivo</b><span>Lo mejor de cada libro, dentro de tu IA</span></div>
      <nav aria-label="Pie"><a href="biblioteca.html">Biblioteca</a><a href="guia.html">Guía de conexión</a><a href="autores.html">Para autores</a><a href="terminos.html">Términos</a><a href="privacidad.html">Privacidad</a></nav>
    </div>
    <span class="edicion">© 2026 — Edición uno · San Salvador</span>
  </div>
</footer>
<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let clave = "";
try { clave = sessionStorage.getItem("tv_admin") || ""; } catch {}
const h = () => ({ authorization: "Bearer " + clave });
const kb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.ceil(n / 1024) + " KB");
async function cargar() {
  $("msg").textContent = "Cargando…";
  const r = await fetch("/admin/envios", { headers: h() }).catch(() => null);
  if (!r || !r.ok) { $("msg").textContent = r && r.status === 401 ? "Clave incorrecta." : "No se pudo cargar."; return; }
  try { sessionStorage.setItem("tv_admin", clave); } catch {}
  const d = await r.json();
  $("msg").textContent = d.length + " envíos";
  $("lista").innerHTML = d.map((e) => '<article class="tarjeta" data-id="' + e.id + '"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>' + esc(e.titulo) + '</strong><span class="estado' + (e.estado === "aprobado" ? " vivo" : "") + '">' + esc(e.estado) + '</span></div><p class="nota" style="margin:6px 0">' + esc(e.autor_nombre) + " · " + esc(e.tipo) + " · " + esc(e.idioma) + " · " + esc(e.archivo_nombre) + " (" + kb(e.archivo_bytes) + ") · cuenta: " + esc(e.cuenta) + " &lt;" + esc(e.email) + "&gt; · " + new Date(e.created_at).toLocaleString("es") + '</p><p>' + esc(e.descripcion) + '</p>' + (e.nota ? '<p class="nota" style="color:#b3261e">Nota: ' + esc(e.nota) + "</p>" : "") + '<p class="nota">Aceptó términos ' + esc(e.terms_version) + " y dominio público el " + new Date(e.dominio_publico_at).toLocaleString("es") + '</p><div class="acciones" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="boton chico claro" data-a="archivo" type="button">Descargar</button>' + (e.estado === "recibido" ? '<button class="boton chico" data-a="aprobar" type="button">Aprobar y publicar</button>' : "") + (e.estado !== "retirado" ? '<button class="boton chico claro" data-a="retirar" type="button">Retirar (ilegal o infractor)</button>' : "") + (e.libro_id ? ' <a class="enlace" href="aporte.html?id=' + encodeURIComponent(e.libro_id) + '">ver publicado</a>' : "") + "</div></article>").join("");
}
$("lista").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest("[data-id]").dataset.id, a = b.dataset.a;
  if (a === "archivo") {
    const r = await fetch("/admin/envios/" + id + "/archivo", { headers: h() });
    if (!r.ok) return alert("No se pudo descargar");
    const u = URL.createObjectURL(await r.blob()); const l = document.createElement("a"); l.href = u; l.download = "envio-" + id; l.click(); return;
  }
  let cuerpo = "{}";
  if (a === "retirar") { const motivo = prompt("Motivo del retiro (queda registrado):"); if (!motivo) return; cuerpo = JSON.stringify({ motivo }); }
  b.disabled = true;
  const r = await fetch("/admin/envios/" + id + "/" + a, { method: "POST", headers: { ...h(), "content-type": "application/json" }, body: cuerpo });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) alert(j.error || "No se pudo completar");
  cargar();
});
$("entrar").addEventListener("click", () => { clave = $("secreto").value.trim(); if (clave) cargar(); });
if (clave) cargar();
</script>
</body>
</html>
